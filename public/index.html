<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HJ-HACKER - WhatsApp Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }
        
        input:focus {
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .code-box {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
        }
        
        .code {
            font-size: 36px;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 5px;
            color: #667eea;
        }
        
        .copy-btn {
            background: #667eea;
            margin-top: 10px;
            width: auto;
            padding: 8px 20px;
            display: inline-block;
        }
        
        .error {
            background: #fee;
            color: #f44;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
        }
        
        .success {
            background: #e8f5e9;
            color: #4caf50;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
        }
        
        .status {
            margin-top: 20px;
            padding: 10px;
            background: #e3f2fd;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .online {
            color: #4caf50;
        }
        
        .footer {
            margin-top: 30px;
            color: #999;
            font-size: 12px;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 8px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🤖 HJ-HACKER</h1>
        <p class="subtitle">WhatsApp Bot Pairing</p>
        
        <div class="input-group">
            <label>📱 WhatsApp Number</label>
            <input type="tel" id="number" placeholder="3XXXXXXXXX" maxlength="10">
            <small style="display: block; margin-top: 5px;">Example: 3266571331 (without 92)</small>
        </div>
        
        <button onclick="getCode()" id="pairBtn">🔗 Get Pairing Code</button>
        
        <div id="result" style="display: none;">
            <div class="code-box">
                <div>Your 6-digit code:</div>
                <div class="code" id="code">------</div>
                <button class="copy-btn" onclick="copyCode()">📋 Copy Code</button>
            </div>
        </div>
        
        <div id="error" style="display: none;" class="error"></div>
        <div id="success" style="display: none;" class="success"></div>
        
        <div class="status" id="status">
            🔄 Checking...
        </div>
        
        <div class="footer">
            © 2024 HJ-HACKER | <a href="#" onclick="checkStatus()">Refresh</a>
        </div>
    </div>
    
    <script>
        async function checkStatus() {
            try {
                const res = await fetch('/health');
                const data = await res.json();
                if (data.connected) {
                    document.getElementById('status').innerHTML = '✅ Bot is <span class="online">Online</span>';
                } else {
                    document.getElementById('status').innerHTML = '⚠️ Bot is connecting...';
                }
            } catch(e) {
                document.getElementById('status').innerHTML = '⚠️ Bot is offline';
            }
        }
        
        async function getCode() {
            const number = document.getElementById('number').value.trim();
            
            if (!number) {
                showError('Please enter number');
                return;
            }
            
            const cleanNumber = number.replace(/\D/g, '');
            if (cleanNumber.length !== 10) {
                showError('Enter 10-digit number');
                return;
            }
            
            const fullNumber = '92' + cleanNumber;
            
            const btn = document.getElementById('pairBtn');
            btn.disabled = true;
            btn.innerHTML = '⏳ Requesting...';
            
            hideError();
            document.getElementById('result').style.display = 'none';
            
            try {
                const res = await fetch(`/pair?number=${fullNumber}`);
                const data = await res.json();
                
                if (data.code) {
                    document.getElementById('code').textContent = data.code;
                    document.getElementById('result').style.display = 'block';
                    await navigator.clipboard.writeText(data.code);
                    showSuccess('✅ Code copied!');
                    document.getElementById('number').value = '';
                } else if (data.error) {
                    showError(data.error);
                } else {
                    showError('Failed. Try again.');
                }
            } catch(e) {
                showError('Network error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🔗 Get Pairing Code';
            }
        }
        
        function copyCode() {
            const code = document.getElementById('code').textContent;
            navigator.clipboard.writeText(code);
            showSuccess('✅ Copied!');
            setTimeout(() => {
                document.getElementById('success').style.display = 'none';
            }, 2000);
        }
        
        function showError(msg) {
            const errDiv = document.getElementById('error');
            errDiv.textContent = '❌ ' + msg;
            errDiv.style.display = 'block';
            setTimeout(() => {
                errDiv.style.display = 'none';
            }, 5000);
        }
        
        function hideError() {
            document.getElementById('error').style.display = 'none';
        }
        
        function showSuccess(msg) {
            const successDiv = document.getElementById('success');
            successDiv.textContent = msg;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }
        
        document.getElementById('number').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') getCode();
        });
        
        checkStatus();
        setInterval(checkStatus, 30000);
    </script>
</body>
</html>
